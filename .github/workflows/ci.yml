name: CI

on:
  push:
    # main plus the land queue's candidates (each heads a PR); work branches (auto/*) get no CI run.
    branches:
      - main
      - "feature/**"
      - "bug/**"
      - "release/**"
      - "merge/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A candidate's PR is already tested by its push run; skip the duplicate pull_request run.
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'bug/') || startsWith(github.head_ref, 'release/'))
    # A red candidate must not fail the run (that sends a mail); the land queue reads the job
    # conclusions instead and the PR shows the red job. Only main and tags fail the run.
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the Electron binary
        # npm 12 does not run install scripts, so fetch the binary explicitly.
        run: node node_modules/electron/install.js
      - name: Enable Electron's setuid sandbox helper
        # Ubuntu 24.04 restricts unprivileged user namespaces; the helper must
        # be root-owned and setuid. Disabling the sandbox would hide the very
        # setting the security tests assert.
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Typecheck
        run: npm run typecheck
      - name: Check dependency boundaries
        run: npm run check:deps
      - name: Run unit tests
        run: npm run test:unit
      - name: Check production dependency licences
        run: npm run check:licenses
      - name: Check coverage ratchet
        # Coverage is a Linux-measured number; see vitest.config.mts.
        if: runner.os == 'Linux'
        run: npm run check:coverage
      - name: Run end-to-end tests
        env:
          MDEDITOR_SKIP_PERF: "1"
        run: npm run test:e2e
      - name: Check acceptance criteria
        # The checker exempts AC-PERF criteria while the perf skip is on.
        env:
          MDEDITOR_SKIP_PERF: "1"
        run: npm run check:acceptance
      - name: Add JUnit summary
        if: always()
        run: node scripts/summarize-junit.mjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ matrix.os }}
          path: |
            reports/
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: ignore

  package-linux:
    name: Package and smoke-test Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      - name: Build Linux x64 packages
        run: npm run dist:linux -- --x64
      - name: Check packaged fuses
        run: node scripts/check-fuses.mjs release/linux-unpacked/mdeditor
      - name: Smoke-test the AppImage
        shell: bash
        run: |
          appimage=$(find release -maxdepth 1 -name '*-x86_64.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          xvfb-run -a node scripts/smoke-appimage.mjs "$appimage" test/fixtures/sample.md
      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-failure
          path: release/
          if-no-files-found: ignore
