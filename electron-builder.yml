appId: io.github.isumer.solidmd
asar: true
directories:
  output: release
icon: build/icon.png
files:
  - dist/**
  - "!dist/THIRD_PARTY_NOTICES.txt"
  - package.json
  - "!**/*.map"
extraResources:
  - from: dist/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: build/icons/512x512.png
    to: window-icon.png
  - LICENSE.md
afterAllArtifactBuild: ./scripts/add-portable-marker.mjs
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  license: LICENSE.md
mac:
  icon: build/icon.icns
  hardenedRuntime: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  icon: build/icons
  # A noreply address so no personal e-mail ships inside public packages.
  maintainer: "isumer <isumer@users.noreply.github.com>"
  # electron-builder writes Categories from this field; desktop.entry.Categories is ignored.
  category: Utility;TextEditor;Development
  mimeTypes:
    - text/markdown
    - text/plain
    - text/x-log
    - application/json
    - application/yaml
    - application/xml
  desktop:
    entry:
      MimeType: text/markdown;text/plain;text/x-log;application/json;application/yaml;application/xml;
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
